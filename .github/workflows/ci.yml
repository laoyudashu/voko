name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ${{ fromJSON(github.event_name == 'pull_request' && '[22]' || '[22,24]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run package:build
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: coverage-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            coverage/
            test-reports/
            test-results/
          if-no-files-found: ignore

  web-e2e:
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium"]' || '["chromium","firefox","webkit"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e
        env:
          VOKO_E2E_BROWSER: ${{ matrix.browser }}
      - name: Collect VOKO E2E runtime artifacts
        if: always()
        run: node scripts/collect-e2e-artifacts.js playwright-report/e2e-runtime
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  e2ee-poc:
    name: E2EE PoC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Test isolated E2EE core
        run: cargo +1.97.1 test --locked --manifest-path e2ee/Cargo.toml
      - name: Test real OS credential store lifecycle
        if: matrix.os == 'windows-latest' || matrix.os == 'macos-latest'
        run: cargo +1.97.1 test --locked --manifest-path e2ee/Cargo.toml -p voko-e2ee-core --test system_key_real -- --ignored --nocapture
      - name: Check browser WASM target
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
          cargo +1.97.1 install wasm-bindgen-cli --version 0.2.127 --locked
          cd e2ee
          cargo +1.97.1 check --locked --target wasm32-unknown-unknown -p voko-e2ee-wasm
          cargo +1.97.1 build --locked --release --target wasm32-unknown-unknown -p voko-e2ee-wasm
          wasm-bindgen --target web --out-dir target/web-poc --out-name voko_e2ee_wasm target/wasm32-unknown-unknown/release/voko_e2ee_wasm.wasm

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run sbom > sbom.cdx.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  ci-gate:
    if: always()
    needs: [test, web-e2e, e2ee-poc, security, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI jobs
        run: |
          node - <<'NODE'
          const required = {
            test: process.env.TEST_RESULT,
            webE2e: process.env.WEB_E2E_RESULT,
            e2eePoc: process.env.E2EE_POC_RESULT,
            security: process.env.SECURITY_RESULT,
          };
          const dependencyReview = process.env.DEPENDENCY_REVIEW_RESULT;
          const failed = Object.entries(required).filter(([, result]) => result !== 'success');
          if (!['success', 'skipped'].includes(dependencyReview)) {
            failed.push(['dependency-review', dependencyReview]);
          }
          if (failed.length > 0) {
            console.error(`Required CI jobs did not pass: ${failed.map(([name, result]) => `${name}=${result}`).join(', ')}`);
            process.exit(1);
          }
          console.log('All required CI jobs passed.');
          NODE
        env:
          TEST_RESULT: ${{ needs.test.result }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
          E2EE_POC_RESULT: ${{ needs.e2ee-poc.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
