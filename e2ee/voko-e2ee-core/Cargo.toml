[package]
name = "voko-e2ee-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
hkdf = "0.12.4"
ed25519-dalek = "2.2.0"
openmls = { version = "=0.9.0-rc.2", default-features = false, features = ["js", "openmls_rust_crypto"] }
openmls_basic_credential = { version = "=0.6.0-rc.2", features = ["clonable"] }
openmls_rust_crypto = "=0.6.0-rc.2"
openmls_traits = "=0.6.0-rc.2"
sha2 = "0.10.9"
rand = "0.8.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.17"
tls_codec = "0.5.0"
zeroize = { version = "1.8.1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
keyring = "=4.1.6"
memory-stats = "=1.2.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# OpenMLS' Rust crypto provider still uses getrandom 0.2 internally. The JS
# backend must be selected explicitly for wasm32-unknown-unknown.
getrandom_old = { package = "getrandom", version = "0.2.17", features = ["js"] }

[dev-dependencies]
criterion = "0.7.0"

[[bench]]
name = "direct_message"
harness = false

[[bin]]
name = "voko-e2ee-relay-poc"
path = "src/bin/relay_poc.rs"

[[bin]]
name = "voko-e2ee-stability"
path = "src/bin/stability.rs"

[[bin]]
name = "voko-e2ee-lite-endpoint"
path = "src/bin/lite_endpoint.rs"

[[bin]]
name = "voko-e2ee-witness-endpoint"
path = "src/bin/witness_endpoint.rs"

[[bin]]
name = "voko-e2ee-canary-acceptance"
path = "src/bin/canary_acceptance.rs"

[[bin]]
name = "voko-e2ee-canary-endpoint"
path = "src/bin/canary_endpoint.rs"

[[bin]]
name = "voko-e2ee-attachment-endpoint"
path = "src/bin/attachment_endpoint.rs"
