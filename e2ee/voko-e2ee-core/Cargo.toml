[package]
name = "voko-e2ee-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
hpke-rs = { version = "=0.7.0", default-features = false, features = ["hazmat", "rustcrypto"] }
hpke-rs-crypto = { version = "=0.7.0", default-features = false }
hpke-rs-rust-crypto = { version = "=0.7.0", default-features = false }
sha2 = "0.10.9"
rand = "0.8.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_jcs = "0.2.0"
thiserror = "2.0.17"
zeroize = { version = "1.8.1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }
